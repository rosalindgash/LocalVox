name: Windows package

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "localvox/**"
      - "localvox.spec"
      - "installer/**"
      - ".github/workflows/windows-package.yml"
      - "pyproject.toml"

jobs:
  package-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pyinstaller

      - name: Build standalone application
        shell: pwsh
        run: pyinstaller --noconfirm --clean localvox.spec

      - name: Smoke test packaged files
        shell: pwsh
        run: |
          if (-not (Test-Path "dist/LocalVox/LocalVox.exe")) { throw "LocalVox.exe was not built" }
          if (-not (Test-Path "dist/LocalVox/_internal/localvox/workers/openvoice_v2_worker.py")) {
            throw "Bundled OpenVoice worker is missing"
          }
          if (-not (Test-Path "dist/LocalVox/_internal/localvox/workers/f5_tts_onnx_worker.py")) {
            throw "Bundled F5-TTS ONNX worker is missing"
          }

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress

      - name: Build installer
        shell: pwsh
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "installer\LocalVox.iss"'

      - name: Upload Windows installer
        uses: actions/upload-artifact@v6
        with:
          name: LocalVox-Windows
          path: installer-output/LocalVox-Setup.exe
          if-no-files-found: error
